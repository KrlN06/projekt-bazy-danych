services:
  postgres:
    image: postgres:18
    container_name: projekt-nalepa-marszalek-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: digital_twins
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Ustaw POSTGRES_PASSWORD w pliku .env}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d digital_twins"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
